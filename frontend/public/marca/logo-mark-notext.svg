<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="260" height="240" fill="none">

  <defs>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="gCobalt" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <g transform="translate(18,22) scale(0.92)">
    <!-- left navy wing -->
    <polygon points="18,58 108,18 96,118 10,128" fill="url(#gNavy)"/>
    <polygon points="18,58 108,18 88,78" fill="#1D4ED8"/>
    <polygon points="18,58 10,128 88,78" fill="#172554"/>
    <!-- mid-left cobalt -->
    <polygon points="22,118 96,78 118,168 28,178" fill="url(#gCobalt)"/>
    <polygon points="22,118 96,78 70,148" fill="#3B82F6"/>
    <polygon points="28,178 118,168 70,148" fill="#1E40AF"/>
    <!-- center plate -->
    <polygon points="78,62 168,48 186,150 92,168" fill="#1D4ED8"/>
    <polygon points="78,62 168,48 140,108" fill="#2563EB"/>
    <polygon points="92,168 186,150 140,108" fill="#1E3A8A"/>
    <!-- purple fold -->
    <polygon points="148,42 198,58 186,108 140,96" fill="url(#gPurple)"/>
    <polygon points="148,42 198,58 172,78" fill="#C4B5FD"/>
    <!-- cyan spike top-right -->
    <polygon points="186,22 232,8 248,48 198,58" fill="url(#gSky)"/>
    <polygon points="186,22 198,58 176,52" fill="#0284C7"/>
    <polygon points="232,8 248,48 198,58" fill="#38BDF8"/>
    <!-- cyan shards bottom-right -->
    <polygon points="168,138 214,118 228,168 176,178" fill="url(#gCyan)"/>
    <polygon points="168,138 214,118 190,156" fill="#7DD3FC"/>
    <polygon points="176,178 228,168 190,156" fill="#0284C7"/>
    <!-- amber tetra -->
    <polygon points="38,168 92,148 78,214" fill="url(#gOrange)"/>
    <polygon points="92,148 118,168 78,214" fill="url(#gAmber)"/>
    <polygon points="38,168 118,168 78,214" fill="#D97706"/>
  </g>

</svg>
