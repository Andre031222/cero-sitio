<?xml version="1.0" encoding="UTF-8"?>
<!--
  viewBox recortado a la caja del dibujo, no al lienzo original.

  El arte ocupa 46x44 de los 64x64 que declaraba el archivo, y todo el sobrante caía a la
  derecha y abajo: en la pestaña se veía un icono pequeño y descentrado, con la mitad del
  espacio vacío. Recortando el viewBox el mismo dibujo llena la casilla.

  El arte mide 46x44 y empieza en (12,12), medido renderizando el SVG sobre un fondo que no
  aparece en el dibujo y recortando: a ojo no se ve, y el primer intento salió mal por dar el
  origen por hecho en (0,0).

  Se cuadra a 48 con una unidad de aire porque la pestaña reserva una casilla cuadrada: con
  un viewBox no cuadrado el navegador lo encaja dentro y vuelve a sobrar margen, que es justo
  lo que se quería quitar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 10 48 48" width="48" height="48" fill="none">

  <defs>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="gCobalt" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Sin cuadro de fondo: el icono se posa sobre la pestaña del navegador, y esa pestaña
       cambia de color con el tema del sistema. Un fondo fijo aquí sería una caja oscura
       recortada sobre una barra clara. -->
  <polygon points="14,18 34,12 50,22 42,34 20,30" fill="url(#gCobalt)"/>
  <polygon points="20,30 42,34 46,50 16,48" fill="#2563EB"/>
  <polygon points="16,48 32,44 28,56 12,52" fill="url(#gOrange)"/>
  <polygon points="42,22 56,16 58,28 46,30" fill="url(#gSky)"/>

</svg>
