  <head>

    <title>Corvo — framework web para Java</title>
    <meta name="description" content="Framework web para Java 21. Un servidor HTTP propio, un hilo virtual por conexión y cero dependencias. java -jar y está corriendo." />

    <!-- El color que pinta la barra del navegador en el móvil. Dos valores: con uno solo, el
         tono claro sale sobre el fondo negro del tema oscuro y canta. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- La tarjeta del enlace. Va aquí y no en React porque los rastreadores de Slack, WhatsApp
         o Twitter no ejecutan JavaScript: leen el HTML que llega y se van. Una etiqueta puesta
         al montar el componente no la ve nadie. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Corvo" />
    <meta property="og:title" content="Corvo — sin contenedor." />
    <meta property="og:description" content="Framework web para Java 21. Un servidor HTTP propio, un hilo virtual por conexión y cero dependencias." />
    <meta property="og:url" content="https://corvo.ginit.dev/" />
    <meta property="og:image" content="https://corvo.ginit.dev/marca/enlace.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
