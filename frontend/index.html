<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PNG y no SVG: el isotipo del kit es raster, y a 32 px llena la casilla. Dos tamaños
         porque el navegador elige, y uno de 256 para cuando alguien lo ancla al escritorio. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/marca/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/marca/logo-primary-256.png" />

    <title>Cero — framework web para Java</title>
    <meta name="description" content="Framework web para Java 25. Un servidor HTTP propio, un hilo virtual por conexión y cero dependencias. java -jar y está corriendo." />

    <!-- El color que pinta la barra del navegador en el móvil. Dos valores: con uno solo, el
         tono claro sale sobre el fondo negro del tema oscuro y canta. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- La tarjeta del enlace. Va aquí y no en React porque los rastreadores de Slack, WhatsApp
         o Twitter no ejecutan JavaScript: leen el HTML que llega y se van. Una etiqueta puesta
         al montar el componente no la ve nadie. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cero" />
    <meta property="og:title" content="Cero — sin contenedor." />
    <meta property="og:description" content="Framework web para Java 25. Un servidor HTTP propio, un hilo virtual por conexión y cero dependencias." />
    <meta property="og:url" content="https://cero.ginit.dev/" />
    <meta property="og:image" content="https://cero.ginit.dev/marca/enlace.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
